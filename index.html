<style>
:root {
  color-scheme: light;
  --accent: #2b7bb9;
  --accent-contrast: #ffffff;
  --accent-text: #1d5f92;
  --bg: #f8f9fb;
  --surface: #ffffff;
  --text: #14171f;
  --text-muted: #5b6472;
  --border: rgba(20, 23, 31, 0.10);
  --radius: 10px;
  --shadow: 0 1px 3px rgba(20, 23, 31, 0.08);
  --space: 16px;
  --success: #0a7a35;
  --danger: #c0262d;
  --warning: #8a5300;
}
*, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
html, body { margin: 0; padding: 0; }
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: linear-gradient(180deg, #eef6fb 0%, #f5fbf7 100%);
  color: #1b2f3f;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
svg { display: block; vertical-align: middle; max-width: 100%; }
button { color: inherit; background-color: transparent; font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.items-center { align-items: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 38px; padding: 0 16px; border: 1px solid transparent; border-radius: calc(var(--radius) - 2px);
  background: var(--accent); color: var(--accent-contrast);
  font-size: 14px; font-weight: 600; line-height: 1; white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
}
.btn:hover { background: #1d5f92; }
.btn:disabled { opacity: 0.45; pointer-events: none; }
.btn[data-variant="secondary"] { background: rgba(20, 23, 31, 0.07); color: var(--text); }
.btn[data-variant="secondary"]:hover { background: rgba(20, 23, 31, 0.13); }
.btn[data-variant="outline"] { background: var(--surface); color: var(--text); border-color: var(--border); }
.btn[data-variant="ghost"] { background: transparent; color: var(--text); }
.btn[data-variant="outline"]:hover, .btn[data-variant="ghost"]:hover { background: rgba(43, 123, 185, 0.10); }

.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px;
  border: 1px solid transparent; border-radius: 999px; background: var(--accent); color: var(--accent-contrast);
  font-size: 12px; font-weight: 600; line-height: 1.5; white-space: nowrap;
}
.badge[data-variant="secondary"] { background: rgba(20, 23, 31, 0.07); color: var(--text); }
.badge[data-variant="outline"] { background: #ffffff; color: var(--text); border-color: var(--border); }

.toaster {
  position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; flex-direction: column-reverse; gap: 8px;
  width: min(360px, calc(100vw - 32px)); pointer-events: none;
}
.toaster .toast { pointer-events: auto; transition: opacity 200ms ease, transform 200ms ease; }
.toaster .toast[aria-hidden="true"] { opacity: 0; transform: translateY(8px); }
.toaster .toast-content {
  padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--text); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); font-size: 13px;
}
.toaster .toast[data-type="success"] .toast-content { border-left: 3px solid var(--success); }
.toaster .toast[data-type="error"] .toast-content { border-left: 3px solid var(--danger); }

.app-header, .app-main {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
}
.app-header {
  padding: 24px 0 8px;
}
.app-header-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  flex-wrap: wrap;
}
.app-title {
  font-size: 1.55rem;
  font-weight: 700;
  margin: 6px 0 2px;
  color: #13344d;
}
.app-subtitle {
  color: #4a6275;
  font-size: .95rem;
  margin: 0;
}
.live-counters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.app-main {
  padding: 8px 0 32px;
}
.quiz-card {
  background: #fff;
  border-radius: 18px;
  box-shadow: 0 6px 20px rgba(20,60,90,.08);
  padding: 24px;
  max-width: 560px;
  margin: 0 auto;
}
.module-tag {
  display: inline-block;
  background: #dff1e7;
  color: #1f6b47;
  border-radius: 999px;
  padding: 4px 12px;
  font-size: .8rem;
  font-weight: 600;
}
.q-counter {
  font-size: .85rem;
  color: #4a6275;
}
.progress-track {
  height: 10px;
  background: #dbe7ef;
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #2b7bb9, #3aa675);
  border-radius: 999px;
  transition: width .4s ease;
}
.question-text {
  font-size: 1.12rem;
  font-weight: 600;
  line-height: 1.5;
  margin: 18px 0 14px;
  color: #13344d;
}
.diagram-wrap {
  background: #f8fbfe;
  border: 1px solid #d9e7f2;
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 16px;
  display: flex;
  justify-content: center;
}
.option-btn {
  display: block;
  width: 100%;
  text-align: left;
  padding: 15px 18px;
  margin-bottom: 11px;
  border-radius: 14px;
  border: 2px solid #cfe0ec;
  background: #fff;
  color: #1b2f3f;
  font-size: 1.02rem;
  cursor: pointer;
  transition: transform .15s ease, border-color .2s ease, background .2s ease;
}
.option-btn:hover:not(:disabled) {
  border-color: #2b7bb9;
  transform: translateY(-1px);
}
.option-btn:disabled {
  cursor: default;
}
.option-btn.correct {
  background: #d7f3e3;
  border-color: #2e9a64;
  color: #14432c;
  font-weight: 600;
}
.option-btn.wrong {
  background: #fde2e2;
  border-color: #c94a4a;
  color: #6e1d1d;
  font-weight: 600;
}
.quiz-footer {

  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.hint-box {
  background: #fff7e0;
  color: #5a4305;
  border-radius: 12px;
  padding: 12px 14px;
  margin-top: 14px;
  font-size: .95rem;
  line-height: 1.5;
}
.feedback-box {
  padding: 16px;
  border-radius: 14px;
  line-height: 1.55;
  margin-top: 16px;
}
.feedback-box.ok {
  background: #e6f6ee;
  color: #14432c;
}
.feedback-box.no {
  background: #fdeeee;
  color: #6e1d1d;
}
.feedback-box p {

}
.hero-score {
  background: linear-gradient(135deg, #e3f1fb 0%, #e2f5ea 100%);
  border-radius: 18px;
  padding: 26px;
  text-align: center;
}
.hero-label {
  text-transform: uppercase;
  letter-spacing: .12em;
  font-size: .8rem;
  color: #4a6275;
  font-weight: 600;
}
.big {
  font-size: 3.1rem;
  font-weight: 700;
  color: #1d5f92;
  line-height: 1.1;
  margin: 6px 0;
}
.hero-caption {
  color: #2c4658;
  margin: 4px 0;
}
.hero-message {
  font-weight: 600;
  color: #13344d;
  margin-top: 10px;
}
.bar-block {
  margin-bottom: 14px;
}
.bar-head {
  display: flex;
  justify-content: space-between;
  font-size: .9rem;
  margin-bottom: 6px;
  color: #1b2f3f;
}
.bar-track {
  height: 14px;
  background: #e3edf4;
  border-radius: 999px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 999px;
  transition: width .5s ease;
}
.bar-fill.weak {
  background: linear-gradient(90deg, #d9793b, #e0a34a);
}
.bar-fill.good {
  background: linear-gradient(90deg, #2b7bb9, #3aa675);
}
.attention-note {
  background: #fff7e0;
  color: #5a4305;
  border-radius: 12px;
  padding: 12px 14px;
  margin-top: 8px;
  font-size: .95rem;
}
.result-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
}
.review-item {
  border-left: 4px solid #c94a4a;
  padding: 16px;
  border-radius: 12px;
  background: #fbf7f7;
  margin-bottom: 14px;

.review-item p {

.app-footer {
  text-align: center;
  font-size: .85rem;
  color: #4a6275;
  padding: 16px;
  margin-top: auto;

.fade-in {
  animation: fadeIn .35s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.eyebrow {
  display: inline-block;
  font-size: .75rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 600;
  color: #1d5f92;
  background: #e3f1fb;
  padding: 4px 10px;
  border-radius: 999px;
}
@media (max-width: 600px) {
  .quiz-card { padding: 18px; }
  .app-header, .app-main { padding-left: 16px; padding-right: 16px; }
  .option-btn { font-size: .98rem; padding: 13px 14px; }
  .big { font-size: 2.5rem; }
}
@media print {
  .app-footer, .result-actions, .quiz-footer { display: none !important; }
  body { background: #fff; }
}
</style>
</head>

  {
    m: 3,
    q: "Qual linha notável reúne todos os pontos que EQUIDISTAM de dois pontos fixos H e I?",
    o: [
      "Bissetriz",
      "Mediatriz do segmento HI",
      "Reta paralela média",
      "Circunferência"
    ],
    c: 1,
    h: "Equidistar de DOIS PONTOS é a propriedade de ouro de qual linha que passa no ponto médio a 90°?",
    e: "Equidistar de dois pontos = Mediatriz. (Equidistar dos dois lados de um ângulo = Bissetriz; equidistar de duas retas paralelas = Reta paralela média)."
  },
  {
    m: 3,
    q: "Desafio do Mapa (pág. 126): Um tesouro está a 1 quarteirão da Rua A e, ao mesmo tempo, à mesma distância das ruas paralelas B e C. De acordo com a Regra de Ouro do Módulo 4, como encontramos o tesouro?",
    o: [
      "Traçando apenas uma circunferência com o compasso",
      "Cruzando DUAS condições: as paralelas a 1 quarteirão da Rua A com a reta paralela média entre B e C",
      "Medindo com o transferidor o ângulo entre as ruas",
      "Marcando um ponto qualquer no meio da Rua A"
    ],
    c: 1,
    h: "Lembre da Regra de Ouro: todo ponto exato nasce do CRUZAMENTO de duas linhas!",
    e: "Todo ponto nasce da interseção (cruzamento) de duas linhas: traçamos o par de paralelas a 1 quarteirão da Rua A e cruzamos com a reta paralela média entre B e C."
  }
];

const MODULE_NAMES = {
  1: "Bloco 1: Bissetriz e Ângulos",
  2: "Bloco 2: Mediatriz e Esquadros",
  3: "Bloco 3: Revisão e Linhas Notáveis"
};
const MODULES = [1, 2, 3];

const state = {
  screen: "quiz",
  current: 0,
  answers: Array(QUESTIONS.length).fill(null),
  hintShown: Array(QUESTIONS.length).fill(false),
  retakeIndexes: null
};

function showToast(message, opts) {
  opts = opts || {};
  const toaster = document.querySelector(".toaster") || document.body.appendChild(Object.assign(document.createElement("div"), { className: "toaster" }));
  const item = document.createElement("div");
  item.className = "toast";
  item.setAttribute("aria-hidden", "true");
  if (opts.type) item.setAttribute("data-type", opts.type);
  const content = document.createElement("div");
  content.className = "toast-content";
  content.textContent = message;
  item.appendChild(content);
  toaster.appendChild(item);
  requestAnimationFrame(() => item.setAttribute("aria-hidden", "false"));
  setTimeout(() => {
    item.setAttribute("aria-hidden", "true");
    setTimeout(() => item.remove(), 350);
  }, 3000);
}

function activeIndexes() {
  return state.retakeIndexes || QUESTIONS.map((_, i) => i);
}

function isCorrect(i) {
  return state.answers[i] !== null && state.answers[i] === QUESTIONS[i].c;
}

function hitsCount() {
  return activeIndexes().filter(i => isCorrect(i)).length;
}

function updateCounters() {
  const answered = activeIndexes().filter(i => state.answers[i] !== null).length;
  const hits = activeIndexes().filter(i => isCorrect(i)).length;
  const a = document.getElementById("badgeAnswered");
  const h = document.getElementById("badgeHits");
  if (a) a.textContent = answered + " respondidas";
  if (h) h.textContent = hits + " acertos";
}

function scrollTop() {
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function render() {
  const app = document.getElementById("app");
  if (state.screen === "quiz") renderQuiz(app);
  else if (state.screen === "result") renderResult(app);
  else if (state.screen === "review") renderReview(app);
  updateCounters();
}

function renderQuiz(app) {
  const idxs = activeIndexes();
  const pos = state.current;
  const qi = idxs[pos];
  const q = QUESTIONS[qi];
  const answered = state.answers[qi] !== null;
  const isLast = pos === idxs.length - 1;
  const pct = (pos / idxs.length) * 100;
  const hint = state.hintShown[qi];

  let diagramHtml = "";
  if (q.svg && SVGS[q.svg]) {
    diagramHtml = `<div class="diagram-wrap">${SVGS[q.svg]}</div>`;
  }

  let optionsHtml = q.o.map((opt, k) => {
    let cls = "option-btn";
    if (answered) {
      if (k === q.c) cls += " correct";
      else if (k === state.answers[qi]) cls += " wrong";
    }
    return `<button class="${cls}" data-choice="${k}" ${answered ? "disabled" : ""}>${escapeHtml(opt)}</button>`;
  }).join("");

  let feedback = "";
  if (answered) {
    const ok = state.answers[qi] === q.c;
    feedback = `<div class="feedback-box ${ok ? "ok" : "no"} fade-in">
      <strong>${ok ? "✅ Muito bem! Resposta certa." : "❌ Atenção! Não foi dessa vez."}</strong>
      <p>${escapeHtml(q.e)}</p>
    </div>`;
  }

  app.innerHTML = `
  <div class="quiz-card fade-in">
    <div class="row between items-center">
      <span class="module-tag">${MODULE_NAMES[q.m]}</span>
      <span class="q-counter">Questão ${pos + 1} de ${idxs.length}</span>
    </div>
    <div class="progress-track" style="margin-top:10px"><div class="progress-fill" style="width:${pct}%"></div></div>
    <h2 class="question-text">${escapeHtml(q.q)}</h2>
    ${diagramHtml}
    <div id="options">${optionsHtml}</div>
    ${hint && !answered ? `<div class="hint-box">💡 <strong>Dica:</strong> ${escapeHtml(q.h)}</div>` : ""}
    ${feedback}
    <div class="quiz-footer">
      <button class="btn" data-variant="ghost" id="btnHint" ${answered || hint ? "disabled" : ""}>💡 Precisa de uma dica?</button>
      <button class="btn" id="btnNext" ${answered ? "" : "disabled"}>${isLast ? "Ver resultado" : "Próxima ➔"}</button>
    </div>
  </div>`;

  app.querySelectorAll(".option-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const choice = Number(btn.dataset.choice);
      state.answers[qi] = choice;
      render();
    });
  });

  const hintBtn = document.getElementById("btnHint");
  if (hintBtn) hintBtn.addEventListener("click", () => {
    state.hintShown[qi] = true;
    render();
  });

  const nextBtn = document.getElementById("btnNext");
  if (nextBtn) nextBtn.addEventListener("click", () => {
    if (isLast) {
      state.screen = "result";
    } else {
      state.current++;
    }
    render();
    scrollTop();
  });
}

function message(pct) {
  if (pct >= 85) return "Sensacional, Bia! Você dominou a matéria da prova!";
  if (pct >= 65) return "Muito bom! Você está super bem preparada para amanhã.";
  if (pct >= 45) return "Bom esforço! Dê uma olhada rápida nos erros para fechar 100%.";
  return "Sem pressa! Leia a explicação dos erros e refaça o treino.";
}

function moduleStats() {
  const idxs = activeIndexes();
  return MODULES.map(m => {
    const qs = idxs.filter(i => QUESTIONS[i].m === m);
    const hits = qs.filter(i => isCorrect(i)).length;
    const total = qs.length;
    const pct = total ? Math.round((hits / total) * 100) : 0;
    return { m, hits, total, pct };
  }).filter(s => s.total > 0);
}

function renderResult(app) {
  const idxs = activeIndexes();
  const hits = hitsCount();
  const total = idxs.length;
  const pct = Math.round((hits / total) * 100);
  const stats = moduleStats();
  const worst = stats.reduce((a, b) => (b.pct < a.pct ? b : a), stats[0]);
  const wrongCount = idxs.filter(i => !isCorrect(i)).length;

  const bars = stats.map(s => {
    const cls = s.m === worst.m && s.pct < 75 ? "weak" : "good";
    return `<div class="bar-block">
      <div class="bar-head"><span>${MODULE_NAMES[s.m]}</span><span>${s.hits}/${s.total} · ${s.pct}%</span></div>
      <div class="bar-track"><div class="bar-fill ${cls}" style="width:${s.pct}%"></div></div>
    </div>`;
  }).join("");

  const attentionHtml = wrongCount > 0
    ? `<div class="attention-note">📌 Ponto de atenção: <strong>${MODULE_NAMES[worst.m]}</strong> teve ${worst.pct}% de acertos. Vale revisar essas questões!</div>`
    : `<div class="attention-note" style="background:#e6f6ee;color:#14432c;">🏆 Gabaritou! Você acertou todas as questões!</div>`;

  app.innerHTML = `
  <div class="quiz-card fade-in">
    <div class="hero-score">
      <div class="hero-label">Seu desempenho</div>
      <div class="big">${pct}%</div>
      <p class="hero-caption">${hits} de ${total} acertos nesta rodada</p>
      <p class="hero-message">${message(pct)}</p>
    </div>
    <h3 style="margin:22px 0 12px;color:#13344d">Desempenho por assunto</h3>
    ${bars}
    ${attentionHtml}
    <div class="result-actions">
      <button class="btn" id="btnReview" ${wrongCount === 0 ? "disabled" : ""}>Revisar respostas erradas (${wrongCount})</button>
      <button class="btn" data-variant="secondary" id="btnRetryWrong" ${wrongCount === 0 ? "disabled" : ""}>Refazer só os erros (${wrongCount})</button>
      <button class="btn" data-variant="outline" id="btnRetryAll">Refazer o quiz completo</button>
      <button class="btn" data-variant="ghost" id="btnCopy">Copiar resultado</button>
    </div>
  </div>`;

  const rev = document.getElementById("btnReview");
  if (rev) rev.addEventListener("click", () => { state.screen = "review"; render(); scrollTop(); });
  const rw = document.getElementById("btnRetryWrong");
  if (rw) rw.addEventListener("click", () => {
    const wrong = activeIndexes().filter(i => !isCorrect(i));
    resetFor(wrong);
    showToast("Refazendo " + wrong.length + " questão(ões) que você errou.");
  });
  document.getElementById("btnRetryAll").addEventListener("click", () => {
    resetFor(null);
    showToast("Quiz reiniciado. Boa sorte!");
  });
  document.getElementById("btnCopy").addEventListener("click", () => copyResult(hits, total, pct, stats));
}

function resetFor(indexes) {
  if (indexes) {
    state.retakeIndexes = indexes;
    indexes.forEach(i => { state.answers[i] = null; state.hintShown[i] = false; });
  } else {
    state.retakeIndexes = null;
    state.answers = Array(QUESTIONS.length).fill(null);
    state.hintShown = Array(QUESTIONS.length).fill(false);
  }
  state.current = 0;
  state.screen = "quiz";
  render();
  scrollTop();
}

function copyResult(hits, total, pct, stats) {
  const lines = [
    "Desafio de Desenho Geométrico — 6º Ano",
    `Resultado: ${hits} de ${total} acertos (${pct}%)`,
    ...stats.map(s => `${MODULE_NAMES[s.m]}: ${s.hits}/${s.total} (${s.pct}%)`),
    message(pct)
  ].join("\n");
  if (!navigator.clipboard) {
    showToast("Não foi possível copiar neste navegador.", { type: "error" });
    return;
  }
  navigator.clipboard.writeText(lines).then(
    () => showToast("Resultado copiado!", { type: "success" }),
    () => showToast("Não foi possível copiar o resultado.", { type: "error" })
  );
}

function renderReview(app) {
  const wrong = activeIndexes().filter(i => !isCorrect(i));
  const items = wrong.map(i => {
    const q = QUESTIONS[i];
    const mine = state.answers[i];
    const yours = (mine === null || mine === undefined) ? "Não respondida" : q.o[mine];
    return `<div class="review-item">
      <span class="module-tag">${MODULE_NAMES[q.m]}</span>
      <p><strong>${escapeHtml(q.q)}</strong></p>
      <p>❌ <strong>Sua resposta:</strong> ${escapeHtml(yours)}</p>
      <p>✅ <strong>Resposta correta:</strong> ${escapeHtml(q.o[q.c])}</p>
      <p><strong>Explicação:</strong> ${escapeHtml(q.e)}</p>
    </div>`;
  }).join("");

  app.innerHTML = `
  <div class="quiz-card fade-in">
    <h2 style="margin:0 0 6px;color:#13344d">Revisão das respostas</h2>
    <p class="app-subtitle">${wrong.length === 0 ? "Você não errou nenhuma questão desta rodada." : "Veja o que marcou, a resposta correta e a explicação de cada erro."}</p>
    <div style="margin-top:18px">${items}</div>
    <div class="result-actions">
      <button class="btn" data-variant="outline" id="btnBackResult">Voltar ao resultado</button>
    </div>
  </div>`;
  document.getElementById("btnBackResult").addEventListener("click", () => { state.screen = "result"; render(); scrollTop(); });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
